version: "3.8"

services:
  # ── Neuro-Ops Own Demo Services ──────────────────────────────────────────
  web:
    build: ./services/web
    ports:
      - "5000:5000"
    restart: always

  api:
    build: ./services/api
    ports:
      - "5001:5001"
    restart: always

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: neuroops
      POSTGRES_PASSWORD: neuroops123
      POSTGRES_DB: neuroops_db
    ports:
      - "5432:5432"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./services/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - api

  # ── Observability Stack ───────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-lifecycle'          # enables /-/reload endpoint
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - web
      - api

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=neuroops123
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"

  # ── Neuro-Ops Brain ───────────────────────────────────────────────────────
  neuroops-core:
    build: ./neuroops_core
    ports:
      - "8000:8000"
    depends_on:
      - prometheus
      - loki
    restart: always
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - LOKI_URL=http://loki:3100
      - PROMETHEUS_CONFIG_PATH=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring:/etc/prometheus         # so it can rewrite prometheus.yml
      - neuroops_data:/data/neuro-ops        # persistent registry + models
      - /var/run/docker.sock:/var/run/docker.sock  # for container restart actions

  # ── Dashboard ─────────────────────────────────────────────────────────────
  dashboard:
    build: ./dashboard
    ports:
      - "3001:3001"
    depends_on:
      - neuroops-core

volumes:
  prometheus_data:
  grafana_data:
  neuroops_data:
