global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'web-service'
    static_configs:
      - targets: ['web:5000']

  - job_name: 'api-service'
    static_configs:
      - targets: ['api:5001']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']